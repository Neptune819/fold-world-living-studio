;meta charset=&quot;utf-8&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;body{padding:25px;color:#354039;background:#fffdf6}pre{font:16px/2 Microsoft YaHei,Arial,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;height:auto}figure{margin:25px 0}h2{font:22px Arial}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;pre&gt;第一段｜3.1 潜伏时代 (The Latent Era)
镜头 01｜逃入深井：文明的垂死退行
时长：14秒
场景详尽设定： 前朝废弃千年的垂直地热勘探竖井，深达数千公里。这是一口完全浸没在绝对黑暗中的垂直地质深渊，上下四方皆是深不见底的漆黑。只有每隔百米钉死在玄武岩壁上的昏暗深红防爆应急马灯，切出狭窄暗弱的红色锥形光束。光束内可见大口径粗黑铸铁排污管与犬牙交错的粗暴钢架，无数层用冲压废铁网和麻绳粗暴吊挂的螺旋维修梯顺着井壁沉入虚无，焊缝满是粗糙焊瘤。
画面动态与动作设计：
0—5秒：垂直深井大俯拍，摄影机缓缓沉降。除了微弱红灯周围微弱的光斑，整座深井宛如被墨汁灌满。数万名身披破旧石棉毯、戴着口罩的难民扶着滑腻的铁栏杆，化为一串串黑沉沉的剪影，机械地向深渊下行。铁靴踏击锈铁格栅的沉闷回响在虚空中层层激荡。
5—10秒：侧面中景跟随镜头。一名工人肩扛用铁丝捆扎的干粮包，在狭窄转角险些踏空，被同伴一把拉回。安全网早已断裂，下方的绝对黑暗瞬间吞没了一具失足跌落的躯体，甚至听不到回声；人群甚至没有停步，麻木地抓紧冰冷的铁扶手继续下行。
10—14秒：仰拍大广角。上空数千米处，由数十块不规则厚重装甲板拼焊而成的野蛮防爆闸门，在粗暴的气缸轰鸣中沉重合拢。“轰！！”的一声闷响，地表最后的白垩色冲击波火光被彻底切断，世界跌入无尽的生锈钢铁深渊与仅剩几抹暗红微光的死寂之中。
旁白 (VO)：
	EN：In the first year after the fall, there were no eulogies. The survivors retreated down the freezing geothermal shafts, deeper into the dark. What once was a miner&amp;#x27;s chute now became humanity’s final ark.
手绘油画参考图提示词 (中文)：
传统手绘厚涂油画，卡拉瓦乔式强明暗对照法，大面积纯黑阴影与厚重刮刀质感，粗糙亚麻布纹理。极度幽暗深邃的垂直工业矿井深渊，四周完全吞没在深墨黑与焦炭色中，仅有几盏昏暗微弱的深红防爆马灯切出狭窄锥形红光。数千名避难者的深黑剪影沿着陡峭粗糙的悬空生铁栈桥向下移动，粗大外露的铸铁管道与吊索，光束外是无底黑暗，压抑冷酷、沉重窒息的末日逃亡史诗 --ar 16:9


镜头 02｜退化：黑苔、咳嗽与废料堆
时长：12秒
场景详尽设定： 竖井深处的重型泵机检修长廊。四周一片漆黑，唯一的照明来自一盏挂在铁管下、用废机油点燃的摇曳马灯，只能照亮方圆两三米的狭窄区域。头顶蒸汽回水管外包覆的石棉绝缘层已经溃烂，露出暗色生铁管壁，冷凝水滴落在泥泞积水里。管壁背光处附生着一层厚重、黏稠、散发着刺鼻硫磺味的墨黑色转基因工业苔藓。过道死角堆弃着旧时代废料：外壳开裂的纳米修复针、剥离了线圈的神经外骨骼，全部沉没在泥泞与阴影中。
画面动态与动作设计：
	0—4秒：贴地横移特写。马灯昏暗的土黄火光边缘，一名消瘦男子用一块磨利的生锈弹簧钢片在管壁上用力刮削，将大片粘稠的墨黑苔藓狠狠铲进一只生铁盒中，黑色汁液顺着粗糙的手指滴入泥水中。
	4—8秒：中景。过道两侧只有暗淡微光，几名病人蜷缩在发霉的粗帆布阴影下剧烈咳嗽。一名妇女在微弱光晕中拼命按压一支外壳开裂的旧时代纳米注射器，但仪器屏幕布满黑斑，推杆卡死。她绝望地将废弃针管摔在浸满机油的死水里。
	8—12秒：摄影机后拉。两名裹着油毡的壮汉无声地将一具盖着铁丝网的遗体拖入更深处的全黑廊道，金属在泥水里摩擦出钝响。借着远处一点摇晃的火苗，隐约可见岩壁上曾经用粉笔写下的微积分公式早已被黑泥抹去，只留下生生凿进铁皮里的生存天数刻痕。
旁白 (VO)：
	EN：Without nanobots to mend living cells, a simple flu wiped out whole blocks. To survive, they scraped black moss from industrial conduits. The minds that once played god regressed faster than beasts.
手绘油画参考图提示词 (中文)：
手绘复古废土写实油画，厚涂厚刮，粗矿平头笔刷，极暗环境中的局部火光打光。极其阴暗逼仄的地下重工业废弃走廊，大面积深黑与泥褐色的纯黑暗部，仅靠一盏摇曳昏暗的生锈土黄机油马灯照亮局部。面容消瘦的末日幸存者手持生锈金属片刮食铁管上的黑色黏稠苔藓，泥泞阴影里散落着破碎发黄的高科技空针筒，病患蜷缩在粗麻布下，窒息残酷的求生氛围，油画胶质感与粗糙画布肌理 --ar 16:9


镜头 03｜遗忘：新生的铁笼
时长：14秒
场景详尽设定： 地下数千米深处的巨型管线跨越中枢。空间宏大却无光，犹如一座冰冷的黑色石棺。四周是杂乱无章的重型工字钢架与粗铁丝捆绑的悬空管道。百米外的黑暗中，一台数十米宽的旧时代巨型通风叶轮因齿轮干磨，在微弱的暗红应急低压灯光下以龟速卡顿旋转，巨大的叶片将红光切割成一道道如同牢笼铁条般的狭长阴影，扫过冰冷潮湿的玄武岩裂口。
画面动态与动作设计：
	0—5秒：近景仰拍。一个七八岁的地下新生代孩童赤着脚坐在一条悬空的黑色粗大管道边缘，身上披着用反光隔热铝箔和厚毛毡粗糙缝补的破袍。孩童隐匿在阴影中，唯有手里握着的一块边角开裂的前朝黑金晶体核心，在红光扫过时掠过一丝微弱的自感磷光。他毫无敬畏地把这枚神级核心当作石子，用力敲打身旁的生铁大铆钉。
	5—10秒：摄影机顺着孩子冷漠的视线向上仰望。头顶没有天空，只有大片大片吞噬一切的绝对纯黑，其间横亘着生锈钢梁、粗大的阀门轮廓和永远不熄灭的昏暗红灯，视野里没有任何自然的色彩。
	10—14秒：孩子手指一松，那枚曾凝聚着文明灵魂数据的晶体从高空坠下，在交错的废铁管间接连撞出钝响，最终无声没入下方充满黑油残渣的死水池中，溅起几点微光后归于漆黑。孩子缩了缩脚，把身子更深地缩回了黑暗的阴影里。
旁白 (VO)：
	EN：Generations slipped away. Philosophy, art, and the stars became meaningless sounds. To children born in the rift, the universe was only rusted iron, weeping rock, and dim red lights. They no longer believed a sky had ever existed.
手绘油画参考图提示词 (中文)：
手绘复古科幻概念油画，约翰·哈里斯经典大空间透视，厚涂刮刀质感，极暗调子。深不见底的漆黑地下机械深渊，大面积曜石黑与焦炭暗部，极远处一盏昏暗血红的低压防爆灯投下微弱光芒，巨大的生锈黑色通风扇叶投射出牢笼般的粗重光影。一个衣衫褴褛的瘦弱孩童坐在悬空黑色铁梁上，手中握着一块破碎微弱发光的黑色高科技晶体，深渊般的孤独与遗忘，粗粝亚麻布纹理，古典厚重 --ar 16:9


第二段｜3.2 地下城邦的建立 (The Pulse of Hearth City)
镜头 04｜降级生存：熔岩河上的铁匠
时长：15秒
场景详尽设定： 深地壳断裂裂谷。四周高耸入云的玄武岩峭壁完全没入深黑，唯一的狂暴光源来自悬崖底部一条奔涌翻滚的深红熔岩暗河。熔岩散发出的炽烈暗橙色火光自下而上打在悬空平台上：那是人类用数十根水桶粗的粗钢索，在熔岩上方凌空吊起的一座粗暴锻造悬台。平台由拆卸下的厚重装甲板铆接拼焊而成，外缘布满粗粝焊瘤。数根粗大的耐火蒸汽管道在热浪中颤抖，滚烫的气浪使暗处的一切产生剧烈的光影晃动。
画面动态与动作设计：
	0—5秒：宏大横移全景。悬挂在粗铁链上的土制换热器水箱在绞盘的咯吱声中被沉入翻腾的熔岩表层；刹那间，高热激发出滔天的滚烫白汽，伴随着高压气阀的尖锐嘶鸣，浓烈的白雾在暗红的火光中如怒龙般横向激射，将深渊切成明暗两半。
	5—10秒：切至锻造悬台中景。三名满身黑灰与油汗的粗壮铁匠戴着铁丝护目镜，手握长柄火钳夹住一截烧至亮橙色的厚重履带钢料。上方一台用旧飞船液压缓冲臂改装的狂暴蒸汽落锤轰然砸下，“咚！！”的一声巨响，暴雨般的金红色铁屑火花在纯黑的背景中呈放射状狂暴炸裂！
	10—15秒：摄影机仰角拉开。工人拉开泄压阀，一股股带着机油焦味的炽白蒸汽冲向百米上方漆黑一片的石质穹顶，在冷凝中化作黑色酸雨滴落。聚变科技已死，在绝对黑暗的地幔深处，原始、粗野的蒸汽重工业在熔岩火光中轰然复活。
旁白 (VO)：
	EN：The secret of fusion was lost; the survivors fell back upon the primitive. Over rivers of boiling magma, they rigged steam pipes and relearned to forge steel. No grace remained—only the brutal muscle of survival.
手绘油画参考图提示词 (中文)：
史诗级手绘厚涂科幻油画，硬核柴油朋克工业风，强明暗对比。漆黑无垠的地下大深渊中，仅靠下方奔腾翻滚的深红炽烈熔岩河照亮，熔岩上方悬挂着粗大钢索吊起的重型生铁锻造平台，粗犷精悍的铁匠手持长钳，巨大的蒸汽落锤狠狠砸向通红发光的钢材，漫天飞溅暴雨般的金红色火花，浓烈白蒸汽冲破黑暗，深渊纯黑与熔岩炽橙的极致撕裂，厚重刮刀色块，野蛮重工力量感 --ar 16:9


镜头 05｜拆解神明：主板为墙，超算化炉
时长：14秒
场景详尽设定： 炉心城重工拆解与重构场。这是一处低矮开阔的地下石厅，四周全被浓重如墨的阴影笼罩，唯有中央燃烧的土制锅炉与电焊弧光构成局部光源。地面散落着从前朝废墟中拖运回来的高维造物残骸：流线型反重力环、碎裂的光量子电路板。一处高达两层楼的古代超级计算机主机柜被推倒在中央，外壳已被钢钎粗暴剥开，露出内部繁复如金线蛛网般的计算核心。
画面动态与动作设计：
	0—5秒：中景平移镜头。两名穿着粗布工作服的工人挥动重型八角铁锤，狠狠砸向一台古代悬浮引擎的外壳，纯金的抗辐射涂层如落叶般剥落卷曲，被踩进乌黑的泥泞油污中。
	5—10秒：切至改装超算主机柜近景。主机柜内部的微缩光路已被全部暴力掏空，焊上了粗黑的生铁炉条，彻底变成了一座燃烧劣质黑煤的土制锅炉。一名精瘦的司炉工在通红的火光中将大块碎煤甩入机柜腹中；狂暴的橙红炉火在机柜内部疯狂咆哮，将原本光洁优雅的机壳烧得焦黑开裂、冒出滚滚刺鼻浓烟，将周围工人的脸映得通红。
	10—14秒：镜头拉开升至高空广角。在远处几盏微弱矿灯的勾勒下，展现出城市外围耸立的一面高达数十米的巨墙——那是由成千上万块闪烁着残余微弱磷光的深绿色量子电路板，用粗劣扭曲的电焊焊痕硬生生拼接而成的防风长城，在纯黑的石穴深处耸立。
旁白 (VO)：
	EN：Precision quantum boards were torn apart and welded into windbreak walls. Supercomputers that once plotted orbits were gutted into coal boilers. With blistered hands, they smashed the gods&amp;#x27; relics and recast them in ash.
手绘油画参考图提示词 (中文)：
传统手绘厚涂科幻油画，工业废土写实风格，明显的平头笔刷与刮刀肌理。极其幽暗的地下大型改装工场，大面积深黑色岩壁背景，一台庞大的黑色高科技超级计算机机柜被暴力掏空改造成粗糙的燃煤高炉，炉膛喷吐出滚烫刺目的橙红烈火与滚滚黑烟照亮四周，工人们挥动铁锤砸碎金色高科技残骸。背景是一面由无数深绿色电路板与生锈钢板粗暴拼接而成的防风巨墙，电焊蓝光闪烁，强烈的黑与火对比 --ar 16:9


镜头 06｜炉心城之跃动：钢铁贫民窟的轰鸣
时长：16秒
场景详尽设定： 新文明第一座地下城邦——“炉心城”的宏大横断面全景。整座城市依附在长达数公里的巨大裂谷两侧，没有任何天光，完全靠纵横交错的悬空栈道上点缀的微弱油灯与锅炉火口维持照明。城市由密密麻麻的铆接钢桥、锈迹斑斑的悬挂铁皮棚屋强行组合而成，宛如悬挂在千仞黑崖上的庞大钢铁贫民窟。城市最下方的黑暗基座上，两组重达千吨的铸铁往复式活塞风机正如心脏般搏动，管径数米的生铁排风管道如巨蟒般蜿蜒向上。
画面动态与动作设计：
	0—6秒：高空广角俯拍。整座裂隙深渊大部分沉浸在浓重的黑色阴影中，唯有翻滚的白色高压蒸汽云团穿梭在黑暗里。矿用铁轮重车在倾斜的铁轨上急刹滑下，刹车皮摩擦出长达数十米的刺眼橙色火花瀑布，伴随着尖锐的金属哀鸣，在黑暗裂谷中划出一道撕裂性的亮线。
	6—11秒：切中央主风机站平视中景。房屋大小的巨型铸铁飞轮在粗大连杆带动下极其沉重地旋转，驱动粗壮的活塞杆伴随着震耳欲聋的排气冲程狠狠向前推进！“轰隆！轰隆！”每一次活塞冲程，都从泄压阀喷射出浓烈的白汽，短暂地照亮四周错综复杂的黑铁脚手架与管道。

第五段｜3.5 重返地表 (Return to the Surface)
镜头 13｜冲破万年冰盖：超音速的寒风
时长：14秒
场景详尽设定： 地壳与地表的交界核心带——深埋在数公里厚、泛着幽深蓝黑色的万年甲烷坚冰层。破冰钻探隧道内狭窄而暴烈，直径二十米的垂直通道内充斥着高速旋转的机械切削声。冰壁在超高压与超硬钻头的摩擦下产生严重的晶格挤压，四周的冰壁被机甲喷出的过热蒸汽瞬间融化成水，又在上升的刺骨冷风中再次炸裂成漫天白雾与碎冰屑。
画面动态与动作设计：
	0—5秒：斜仰大特写视角。机甲巨大的复合钻头锋刃正以狂暴的扭矩狠狠咬碎最顶层的幽蓝坚冰，重达数吨的巨大冰块在合金钻尖前被生生碾成白色粉末，如雪崩般顺着排屑槽向机体后方疯狂抛射！
	5—9秒：保持主视角向上推移。坚硬的冰壁深处突然爆开数千道蛛网状的放射状裂缝，裂缝最深处，一道久违的、刺眼至极的淡金苍白日光，带着绝对冰冷的纯净，如利剑般骤然刺破黑暗！伴随着一声犹如整颗星球被撬开般的沉闷轰鸣，整块厚达上百米的极地冰盖被机械臂硬生生掀开一个大洞！
	9—14秒：切钻头破口处的水平逆光构图。海王星地表时速一千公里的超音速极地寒流夹杂着锋利如刀刃的固态冰屑，像决堤的海啸般顺着破裂口狂暴灌入隧道！原本滚烫的工业蒸汽在接触外界空气的毫秒间被瞬间冻结为白雾暴雪，机甲厚重石英观测窗外瞬间爬满了厚厚白霜，但在那层冰霜裂纹之后，是阔别了数千年的、浩瀚无垠的真实苍穹。

	EN：The drill tore through miles of eternal ice, thrusting aside the final mantle of stone. A supersonic blizzard laden with ice daggers rushed into the breach. It was negative two hundred degrees—yet in that blinding second, the pilot saw light.

镜头 14｜海王星的荒原：折断的墓碑与群山
时长：16秒
场景详尽设定： 真正的海王星地表终极全景。一片死寂、苍茫、残酷到极致的深蓝色极寒冰原。极目远眺，天地间只剩下深邃的钴蓝、铅灰与狂风卷起的苍白暴风雪。遥远的天际线上，一颗遥远微弱得像个冰冷光点的白色太阳悬挂在地平线边缘。地表之上耸立着难以想象的史诗级文明废墟：数公里长、宛如横卧山脉般的前朝巨型歼星舰残骸斜插在冻原上，外壳满是冰蚀与伤痕；更远方的铅灰云层下，那座曾经通向太空的轨道电梯底座，宛如一截被天神暴力折断的巨型十字墓碑，孤绝而凄凉地直刺风暴呼啸的天幕。

	11—16秒：切回机甲驾驶舱特写内部。驾驶员颤抖着用满是煤灰的粗布手套，吃力地擦拭去舷窗上的水汽冰晶。隔着加厚玻璃，他的眼眸深处倒映着那片死寂、残酷、却拥有着无尽真实的深蓝故乡。

镜头 15｜神明残羹：冰封的丰碑与宝藏
时长：13秒
场景详尽设定： 距钻井口两公里外的冰封低洼地，前朝战略储备仓库群遗迹。整片遗迹由半倒塌的古代高强度碳化硅穹顶构成，大部分已被埋进数十米深的冰雪之中。狂暴的极地风暴在库门周围形成剧烈的回旋风雪。库区大门半开，露出内部深邃平整的冷藏库室。外围散落着被万年坚冰冻住的重型工程运输车残骸，车轮和机械臂保持着千万年前熄火时的姿态。

	8—13秒：摄影机顺着队员手电的强光光束向库内窥探：在未被氧化的真空仓内，整整齐齐地码放着成千上万根封装在水晶管内、泛着幽绿荧光的高纯度未激活核燃料棒，以及如同金字塔般堆叠的高纯度稀土合金锭。队员激动地掏出信号枪，一发猩红的求援信号弹划破狂风，在铅灰色的苍穹下炸开刺眼的红云。

镜头 16｜极光港的诞生：冰原上的钢铁第一钉
时长：16秒
场景详尽设定： 人类夺回地表的第一座永久性工业要塞——“极光港”建设全景。工地环绕在破冰竖井周边五百米范围内。四台“破冰者”重型机甲分列四角，庞大的背部均质装甲朝向外侧风暴，形成环形的钢铁防风城墙；机甲底部的蒸汽管网连接着从地下井口源源不断引出的过热地热蒸汽，数十根粗大的铸铁烟囱向天幕持续喷射着白垩色的蒸汽云，在工地正上方与零下两百度的极寒空气剧烈碰撞，凝结成一座半透明的巨型保护性冰雾穹顶。
画面动态与动作设计：
	0—5秒：中景水平横移镜头。几十名身穿油污厚防寒服的钢铁工人，腰系防风钢缆，在刺骨寒风中合力抬起一根长达二十米的巨型工字钢柱。两名焊工手持双把重型电弧焊枪迅速抢焊，耀眼炫目的蓝白色电弧在暴风雪中如同闪电般剧烈爆裂，火花在冰面上呲呲融化，将工人们护目镜下坚毅咬牙的面孔映照得如同铸铁雕像。
	5—10秒：摄影机平滑后拉并升至半空。工地中央，一座由多层废弃装甲钢板层层铆接而成的多边形坚固指挥所——“极光港”第一基地拔地而起。基地中央的排气塔突然拉响了一声浑厚震天的工业汽笛，长达十余秒的长鸣穿透了呼啸千年的风雪，滚滚蒸汽在冰原之上宛如一面永不倒下的白色战旗。
	10—16秒：摄影机拉升至极高空广角大俯拍。周围千里的海王星极地暴风雪依然在残酷地撕咬着每一寸冻原，天地一片混沌苍凉的深蓝与漆黑。然而在这极寒冰原的正中央，“极光港”那橘红色的焊接火光、翻腾的白色蒸汽与几盏微弱但坚定的黄色探照灯交织在一起，如同冰巨星心脏上的一粒不灭火种。人类，终于夺回了生存的立足点。
