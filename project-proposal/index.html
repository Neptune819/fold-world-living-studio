<script id="project-data" type="application/json">{"sections":[{"id":"idea","num":"01","time":"0:00–0:50","label":{"zh":"题目与核心想法","en":"Title & central idea"},"title":{"zh":"让游戏的过去，<br>成为可以看见的世界。","en":"Make the game’s past<br>a world we can see."},"lead":{"zh":"《来自深渊：海王星文明纪事》（暂定）是一部 AI 辅助的 2D 科幻背景动画。它把我为游戏写下的文明历史转化为影像，让观众在进入游戏之前，理解这片遗迹从何而来，并产生探索它的欲望。","en":"From the Abyss: Chronicles of a Neptunian Civilization (working title) is an AI-assisted 2D science-fiction background film. It translates the history I wrote for a game into moving images, helping viewers understand where its ruins came from and encouraging them to explore."},"question":{"zh":"当文明一次次试图征服环境，<br>它究竟在接近自由，还是新的囚笼？","en":"As a civilization repeatedly tries to master its environment,<br>is it approaching freedom—or another prison?"},"details":[{"zh":"<h3>作品的用途</h3><p>我把动画定位为未来游戏的背景介绍或开场影像：它先建立世界的历史与情绪，再把观众带到玩家即将进入的未知空间。当前 Final Project 的主要产出是动画，游戏构想为它提供背景和叙事目的。</p>","en":"<h3>Purpose of the film</h3><p>I see the animation as a background introduction or opening film for a future game. It establishes history and mood, then leads viewers toward the unknown space players will enter. The main final-project output is the film; the game concept gives it context and a narrative purpose.</p>"},{"zh":"<h3>故事主线与预期体验</h3><p>架空的海王星文明从恒光带与悬浮城市的繁荣，走向意识与肉体的价值冲突、战争和崩溃；幸存者进入地下建立炉心城，再尝试返回地表。后续故事延伸到复兴、北境远征与不可归的深渊。我希望观众先向往这个世界，再感到失控与压迫，最后在求生与未知中重新产生好奇。</p>","en":"<h3>Story and intended experience</h3><p>A fictional Neptunian civilization moves from artificial light and floating cities to a conflict over consciousness and the body, war, and collapse. Survivors rebuild in Hearth City underground and attempt to reach the surface. Later history continues through revival, a northern expedition, and an abyss from which they cannot return. I want viewers to feel attraction, loss of control, pressure, and finally renewed curiosity.</p>"}],"speech":{"zh":"我的项目暂定名为《来自深渊：海王星文明纪事》，是一部 AI 辅助的 2D 动画，也是我所构思游戏的背景影像。故事发生在架空的海王星：文明创造了悬浮城市和永恒光照，却因进化方向的分歧走向战争。幸存者在地下重建生活，之后重新探索地表与深渊。我想用这段历史解释玩家为什么会面对这样的遗迹，也让观众感受到从繁荣到失落，再到求生与探索的变化。核心问题是：文明不断试图控制环境，是否真的能获得自由？","en":"My project has the working title From the Abyss: Chronicles of a Neptunian Civilization. It is an AI-assisted 2D animation and a background film for a game I am developing conceptually. The story takes place on a fictional Neptune. A civilization creates floating cities and permanent light, but disagreement over human evolution leads to war. Survivors rebuild underground, then explore the surface and abyss. Through this history, I want to explain the ruins players will encounter and create an emotional progression from prosperity to loss, survival, and curiosity. My central question is whether controlling an environment actually brings freedom."}},{"id":"motivation","num":"02","time":"0:50–1:35","label":{"zh":"动机与兴趣","en":"Motivation & interests"},"title":{"zh":"从一次观看，<br>走向自己的游戏世界。","en":"From watching a story<br>to imagining my own world."},"lead":{"zh":"我的起点是观看动画《来自深渊》。它让我想做一个具有类似探索吸引力的游戏：一个漂亮、神秘，却不能被轻易理解的世界。为这个游戏写下背景故事之后，我发现这些文字本身也可以成为一部动画。","en":"My starting point was watching Made in Abyss. It made me want to imagine a game with a similar appeal of exploration: a beautiful, mysterious world that cannot be understood immediately. After writing a background story for that game, I realised the text could also become an animation."},"details":[{"zh":"<h3>我真正感兴趣的是什么？</h3><p>吸引我的不只是“深渊”这个地点，而是探索的驱动力：人为什么愿意走向未知？环境中的遗迹怎样提示过去？一个让人向往的地方，为什么同时让人不安？我希望把这些问题转化为自己的世界设计，而不只停留在相似的景观上。</p>","en":"<h3>What interests me?</h3><p>My interest goes beyond the abyss as a location. It is about what drives exploration: why do people enter the unknown, how do ruins suggest a past, and why can an inviting place also feel disturbing? I want to translate these questions into my own world design rather than only similar scenery.</p>"},{"zh":"<h3>为什么先做 2D 动画？</h3><p>文字能说明技术和历史，但影像能让人感到尺度、温度和处境。广场上的孩子让繁荣成为普通人的生活；坠落的城市让战争的代价可见；地下炉火和破冰者机甲让求生变得具体。动画也能帮助我检验游戏世界是否具有清晰的视觉身份与情绪方向。</p>","en":"<h3>Why begin with 2D animation?</h3><p>Text explains technology and history; images communicate scale, temperature, and lived conditions. A child in a square makes prosperity ordinary and personal. A falling city makes the cost of war visible. Furnace light and an Icebreaker machine give survival a concrete form. Animation also lets me test whether the game world has a coherent visual identity and emotional direction.</p>"}],"speech":{"zh":"我的真实动机是看了《来自深渊》以后，想构思一个同样能让人不断探索的游戏。对我来说，吸引力来自环境背后的历史，以及美丽和危险同时存在的感觉。于是我先为自己的游戏写了一段背景故事，又发现悬浮城市、战争、地下求生这些内容很有画面感。我选择做 2D 动画，是希望观众不仅知道发生了什么，还能通过人物尺度、光线、运动和声音，感受到这个世界曾经如何生活，又为什么变成了值得探索的地方。","en":"My motivation comes from watching Made in Abyss and wanting to imagine a game that creates a similar desire to explore. What attracts me is the history behind an environment and the coexistence of beauty and danger. I wrote a background story for my own game, then realised that its floating cities, war, and underground survival offered strong visual possibilities. I chose 2D animation so viewers can do more than learn what happened. Through human scale, lighting, movement, and sound, they can feel how people lived and why the world became a place worth exploring."}},{"id":"references","num":"03","time":"1:35–2:25","label":{"zh":"灵感与参考","en":"Inspiration & references"},"title":{"zh":"借鉴探索的逻辑，<br>建立自己的视觉语言。","en":"Study the logic of exploration.<br>Build my own visual language."},"lead":{"zh":"参考的作用，是帮助我做出具体的叙事和画面决定。我的研究分为探索体验、科幻空间与绘画质感三个层面；项目图像则用来检验这些方向能否形成统一的影像。","en":"References help me make specific narrative and visual decisions. My research considers the experience of exploration, science-fiction spaces, and a painterly surface. Project images test whether these directions can form a coherent film."},"details":[{"zh":"<h3>叙事参考：动画《来自深渊》</h3><p>我关注未知区域如何持续吸引人，以及环境规则、遗迹和信息缺口如何形成探索动机。在自己的故事中，这被转化为失落科技、断裂的文明史和“为什么无法返回”的疑问。海王星文明、意识冲突、地下重建等内容来自我已经写下的游戏背景。</p>","en":"<h3>Narrative reference: Made in Abyss</h3><p>I focus on how an unknown region maintains curiosity and how environmental rules, ruins, and missing information motivate exploration. In my story, these become lost technology, a broken history, and the question of why return becomes impossible. The Neptunian civilization, consciousness conflict, and underground rebuilding come from the background I have written for my game.</p>"},{"zh":"<h3>视觉研究：John Harris / Chris Foss</h3><p>已有分镜提示词提到了这两个参考方向。接下来我会选具体作品研究宏大空间中的人物尺度、机械结构的辨识度和色彩的组织方式，并把“参考了什么”写清楚。目前页面展示的是自己的 AI 项目参考图，并非两位艺术家的原作。</p>","en":"<h3>Visual research: John Harris / Chris Foss</h3><p>Existing storyboard prompts mention these two reference directions. Next, I will select specific works to study human scale in monumental spaces, distinctive machinery, and colour organisation, and clearly record what informs each decision. The images on this page are my AI project references, not original works by these artists.</p>"},{"zh":"<h3>落实到画面：厚涂、尺度与色温</h3><p>参考图和视频应保留宽笔刷、块面塑形与概括的边缘。繁荣阶段以灰蓝、奶油黄和浅赭色表达日常的安全；战争阶段让熟悉的基础设施失去秩序；地下阶段通过暗部和局部炉火表现生存压力。相邻镜头的笔触、人物和机械外形需要保持连贯。</p>","en":"<h3>On screen: painted forms, scale, and colour</h3><p>Images and video should retain broad brushwork, painted masses, and simplified edges. Blue-grey, cream, and ochre suggest everyday safety during prosperity. War disrupts familiar infrastructure. Darkness and concentrated furnace light express the pressure of underground survival. Brushwork, people, and machinery should remain coherent across adjacent shots.</p>"}],"speech":{"zh":"我把参考分为叙事和视觉两类。《来自深渊》启发的是探索体验：未知的规则、过去的痕迹，以及吸引力和危险之间的关系。我把它发展成自己的海王星背景。视觉上，已有分镜提到 John Harris 和 Chris Foss，我准备继续研究他们作品里的空间尺度和机械设计，并记录具体来源。自己的图像则采用复古科幻厚涂：繁荣时期温暖而开阔，地下时期黑暗而压迫。我会让色彩和构图随着历史变化，帮助观众感受文明的处境。这些图都是项目参考，尚不能证明成片已具备稳定连续性。","en":"I divide my references into narrative and visual research. Made in Abyss inspires the experience of exploration: unknown rules, traces of the past, and the relationship between attraction and danger. I develop that inspiration through my own Neptune setting. Existing storyboards mention John Harris and Chris Foss; I will study spatial scale and machinery in specific works and document the sources. My project images use a retro science-fiction painterly direction. Prosperity is warm and open, while underground survival is dark and compressed. Colour and composition change with the history. These are project references, so continuity still needs to be demonstrated in an edited sequence."}},{"id":"plan","num":"04","time":"2:25–3:20","label":{"zh":"Pathway 与制作计划","en":"Pathway & production plan"},"title":{"zh":"先让故事成立，<br>再让每个镜头完成。","en":"Establish the story first.<br>Then complete the shots."},"lead":{"zh":"选择 Pathway II — Animation / 3D / Video Art，以 AI 辅助的 2D 影像作为主要媒介。现阶段已有世界观文本、前三章分镜、参考图和多个视频测试；下一步要把分散素材组织成可观看、可评价的连续叙事。","en":"I select Pathway II — Animation / 3D / Video Art, with AI-assisted 2D moving images as the main medium. I have worldbuilding text, storyboards for the first three chapters, reference images, and video tests. The next step is to turn separate assets into a continuous sequence that can be watched and evaluated."},"details":[{"zh":"<h3>建议的一期范围</h3><p>优先完成“繁荣 → 战争与崩溃 → 地下重建 / 重返地表”这条因果链。完整背景中的二次复兴和深渊远征保留为后续扩展，或用结尾的一处未知线索引出。这个范围是当前制作建议，具体时长和截止节点需要按课程剩余时间确定。</p>","en":"<h3>Proposed first-stage scope</h3><p>Prioritise the causal chain of prosperity, war and collapse, then underground rebuilding and a return to the surface. Revival and the abyss expedition remain potential extensions, or a final clue can introduce them. This is a production proposal; the final duration and milestones should follow the remaining course schedule.</p>"},{"zh":"<h3>制作顺序与检查节点</h3><p>第一步整理故事，区分必须说明、可以用画面暗示和留给游戏探索的信息。第二步用现有素材、静帧和临时旁白做 animatic，确认顺序与节奏。第三步优先制作转折镜头，再补连接镜头。第四步完成剪辑、声音与调色，并邀请不了解故事的人观看，检查能否理解“发生了什么、为什么改变”。</p>","en":"<h3>Order of production and checkpoints</h3><p>First, separate essential explanations, visual clues, and information for later game exploration. Second, create an animatic from existing material, still images, and temporary narration to test order and timing. Third, produce key turning points before connecting shots. Fourth, complete editing, sound, and colour, then ask someone unfamiliar with the story whether they understand what happened and why things changed.</p>"},{"zh":"<h3>与 Living Studio 网站配合</h3><p>项目页面呈现六部分提案、分镜和测试片段；Visual Journey 保存外部参考及它们如何影响作品；Working Log 按日期记录实际制作、版本取舍、问题和下一步。三处内容互相链接：老师看到的不只是成片，还能追踪我如何把一个想法做出来。</p>","en":"<h3>Connection to the Living Studio website</h3><p>The project page presents this six-part proposal, storyboards, and test clips. Visual Journey records external references and how they inform the work. Working Log records dated production sessions, version choices, problems, and next actions. Linking them makes the development of the idea visible alongside the final film.</p>"}],"speech":{"zh":"我选择 Pathway II，以 2D 影像作为项目的主要形式。目前有故事、前三章分镜、参考图和视频测试，但还需要判断这些素材能否组成清楚的叙事。我建议先完成繁荣、崩溃和地下重建这条主线，把后续深渊作为扩展。下一步先做 animatic，用静帧和临时旁白检查节奏，再集中解决关键镜头，最后整合声音和调色。在网站里，项目页用来展示方向和测试，Visual Journey 记录外部参考，Working Log 记录实际修改与取舍，让制作过程可以被老师追踪。","en":"I choose Pathway II, with 2D moving images as my main form. I already have a story, storyboards for the first three chapters, reference images, and video tests, but I still need to establish a clear sequence. I propose completing prosperity, collapse, and underground rebuilding first, with later abyss events as an extension. I will create an animatic using still frames and temporary narration, refine key shots, then integrate sound and colour. On the website, the project page shows the proposal and tests, Visual Journey documents references, and Working Log documents production decisions and revisions."}},{"id":"workflow","num":"05","time":"3:20–4:25","label":{"zh":"工具、制作与 AI 角色","en":"Tools, production & AI roles"},"title":{"zh":"AI 生成可能性，<br>我负责让镜头有意义。","en":"AI generates possibilities.<br>I give the shots meaning."},"lead":{"zh":"视频生成使用 Seedance 2.5 / minmaxh3，后期使用剪映 / 达芬奇。AI 参与画面与运动的生成测试；我负责故事、分镜、画面约束、版本选择，以及把镜头组织为完整的情绪与因果关系。","en":"I use Seedance 2.5 / minmaxh3 for video generation and Jianying / DaVinci Resolve for post-production. AI participates in visual and motion tests. I decide the story, storyboards, constraints, selected versions, and how shots create a complete emotional and causal sequence."},"details":[{"zh":"<h3>从文字到影像的工作流</h3><p>故事提炼 → 分镜与镜头目的 → 角色 / 场景参考 → 图像到视频测试 → 版本比较 → 粗剪验证 → 声音、字幕与调色。每个镜头先确定它要告诉观众什么，再描述构图、动作、镜头运动和不能改变的内容。图像生成工具尚未在本次汇报中确认，因此不列未经确认的名称。</p>","en":"<h3>Workflow from text to moving image</h3><p>Story selection → storyboard and shot purpose → character/environment references → image-to-video tests → version comparison → rough-cut review → sound, subtitles, and colour. I first decide what a shot must communicate, then specify composition, action, camera movement, and features that should remain stable. The image-generation tool has not been confirmed, so it is not named here.</p>"},{"zh":"<h3>一个具体例子：盛世中的孩子</h3><p>现有分镜把“孩子在广场抱球奔跑”设为日常幸福，而非逃难。参考图固定孩子外形、服装和广场；视频描述只让孩子轻快跑出几步并停下，背景保持稳定。我检查动作是否放松、球和服装是否改变、笔触是否闪烁。这个镜头为之后的断电与战争建立情感反差。</p>","en":"<h3>A concrete example: the child during prosperity</h3><p>The existing storyboard treats a child running with a ball as everyday happiness, not an escape. The reference fixes the child’s appearance, clothes, and square. The video description asks for a few relaxed steps and a stop, keeping the background stable. I check the mood of the movement, ball and clothing continuity, and flickering brushwork. This shot establishes an emotional contrast with the later blackout and war.</p>"},{"zh":"<h3>怎样展示我的创作贡献？</h3><p>保留同一镜头的参考图、提示词、多个版本和取舍理由，说明“为什么留下这一版”。例如某版建筑漂亮，但孩子的动作像逃跑，就不符合镜头目的。AI 输出不是最终判断；分镜意图、相邻镜头的连接和剪辑节奏决定它是否属于这部作品。</p>","en":"<h3>How will I demonstrate my contribution?</h3><p>I will retain the reference, prompt, alternative versions, and selection reasons for each shot. A version may contain beautiful architecture but fail because the child appears to be escaping. AI output does not make the final decision: storyboard intent, continuity with adjacent shots, and editing rhythm determine whether it belongs in the film.</p>"}],"speech":{"zh":"工具方面，我用 Seedance 2.5 和 minmaxh3 做视频，剪映和达芬奇做后期。流程是先确定故事和镜头目的，再准备参考、生成运动版本、比较结果并进入剪辑。AI 提供可以尝试的画面与动作，我负责判断它们是否讲对了故事。比如分镜中的孩子抱球奔跑，要表现和平时期的日常幸福；如果生成结果像逃难，即使画面漂亮也需要修改。我会保留参考、提示词和不同版本，并记录取舍原因，让我的创作贡献体现在镜头设计、约束、选择和最终组织中。","en":"For video, I use Seedance 2.5 and minmaxh3, with Jianying and DaVinci Resolve for post-production. I begin with the story and purpose of each shot, prepare references, generate motion versions, compare results, and edit them. AI offers possible images and actions; I decide whether they tell the intended story. For example, the child running with a ball should communicate ordinary happiness in a peaceful era. If the result looks like an escape, it needs revision even if the image is attractive. I will preserve references, prompts, alternatives, and reasons for selection, making my creative decisions visible throughout production."}},{"id":"questions","num":"06","time":"4:25–5:35","label":{"zh":"问题与预期挑战","en":"Questions & expected challenges"},"title":{"zh":"需要讨论的，<br>是取舍与表达。","en":"The discussion is about<br>scope and expression."},"lead":{"zh":"现阶段最重要的不是增加更多设定，而是确认观众需要理解什么、动画应该做到哪里，以及如何持续控制 AI 镜头。我希望课堂反馈帮助我把宏大的背景缩成一个真正能完成的作品。","en":"The priority is to decide what viewers need to understand, where the film should end, and how to maintain control over AI-generated shots. I want feedback to help turn a large background story into a film I can realistically complete."},"details":[{"zh":"<h3>叙事与范围</h3><p>世界观跨越多个时代，容易变成设定介绍。我的处理办法是保留重要因果关系，用普通人的处境连接宏大事件。需要反馈的问题是：作为游戏开场，哪些信息必须先讲清楚，哪些更适合留在游戏里发现？先完成前三章是否比加入深渊远征更有效？</p>","en":"<h3>Narrative and scope</h3><p>The history spans several eras and risks becoming an explanation of lore. I plan to preserve key causal relationships and connect large events through ordinary people. Which information must a game opening explain, and which is better discovered through play? Is completing the first three chapters more effective than including the abyss expedition immediately?</p>"},{"zh":"<h3>画风、主体与运动的连续性</h3><p>预期风险包括人物换脸、机械变形、笔触闪烁和动作因果不清。先固定关键参考，让每个镜头集中于一个事件，再按相邻镜头而非单张漂亮画面来检查。复杂运动可拆成准备、变化与结果三个镜头；若仍无法稳定，则采用更明确的构图与较少运动。</p>","en":"<h3>Style, subjects, and motion continuity</h3><p>Expected risks include changing faces, deforming machines, flickering brushwork, and unclear actions. I will fix key references, give each shot one event, and judge it in relation to adjacent shots. Complex movement can be divided into preparation, change, and result. If it remains unstable, clearer composition and less movement may communicate the event more reliably.</p>"},{"zh":"<h3>时间与制作证据</h3><p>生成次数并不等于完成度。我会优先修复影响故事理解的问题，并在 Working Log 中写下日期、当前阶段、所做测试、证据、问题、可能解决办法和下一步。希望老师进一步反馈：哪些证据最能说明我对 AI 动画的创作控制？</p>","en":"<h3>Time and production evidence</h3><p>More generations do not necessarily mean more progress. I will prioritise problems that affect understanding and record the date, stage, test, evidence, problem, possible response, and next action in Working Log. I also want feedback on which evidence best demonstrates my creative control over AI-assisted animation.</p>"}],"speech":{"zh":"我预期最大的挑战是信息取舍和镜头连续性。背景故事很长，因此我会先用粗剪判断哪些信息必须解释，哪些可以通过环境暗示。AI 也可能让人物、机械和笔触在镜头间发生变化，所以我会固定参考，拆分复杂动作，并结合相邻镜头评价结果。今天最想得到的反馈是：作为游戏背景动画，哪些内容应该在开场讲清楚？一期是否先完成前三章？以及怎样的分镜、版本比较和日志，能最清楚地证明我对作品的创作控制？这些回答会直接决定下一阶段的范围与制作重点。","en":"The biggest challenges I expect are information selection and continuity. The background story is long, so I will use a rough cut to decide what needs explanation and what can be suggested through environments. AI can also change people, machines, and brushwork between shots. I will fix references, divide complex actions, and evaluate outputs alongside neighbouring shots. My main questions are: what should a game-background film explain at the beginning; should I complete the first three chapters first; and which storyboards, version comparisons, and logs best demonstrate creative control? This feedback will directly guide scope and production priorities."}}],"ui":{"brand":{"zh":"折界 · 创作档案","en":"FOLD WORLD · STUDIO ARCHIVE"},"heroTitle":{"zh":"来自<br><em>深渊</em>","en":"From<br>the <em>Abyss</em>"},"heroSub":{"zh":"海王星文明纪事","en":"Chronicles of a Neptunian Civilization"},"heroLead":{"zh":"一段为游戏写下的历史，<br>一部正在形成的 2D 动画。","en":"A history written for a game.<br>A 2D film taking shape."},"intro":{"zh":"从一个游戏构想出发，<br>把历史、遗迹与未知连接起来。","en":"Starting with a game concept,<br>connecting history, ruins, and the unknown."},"begin":{"zh":"展开项目提案","en":"Enter the proposal"},"mode":{"zh":"课堂模式","en":"Presentation mode"},"read":{"zh":"阅读模式","en":"Reading mode"},"notes":{"zh":"逐段讲稿","en":"Speaker notes"},"close":{"zh":"关闭","en":"Close"},"timing":{"zh":"建议讲述约 5 分 35 秒 · 六部分","en":"Suggested delivery: about 5 min 35 sec · Six parts"},"sample":{"zh":"现有生成测试 · 用于检查画风与运动","en":"Existing generation test · Reviewing style and motion"},"assets":{"zh":"当前素材并非最终成片；未验证的镜头问题作为待检查项。","en":"These assets are not the final film. Unverified shot problems remain review questions."},"bridge":{"zh":"作品与网站，使用同一条研究线索。","en":"The film and website share one line of enquiry."},"bridgeSub":{"zh":"空间网站让人进入世界；项目档案说明这个世界如何被构想和制作。","en":"The spatial website invites people into a world; the project archive explains how that world is conceived and made."},"back":{"zh":"返回折界空间","en":"Return to Fold World"},"print":{"zh":"保存 PDF","en":"Save PDF"},"working":{"zh":"Working Log · 下一次制作记录","en":"Working Log · Next production entry"},"workingText":{"zh":"下一次记录：整理现有镜头并制作 animatic。附上时间线截图和相邻镜头对比，记录故事是否清楚、哪些素材需要替换，以及下一轮优先解决的一个问题。此处为计划，不冒充已经完成的制作日志。","en":"Next entry: organise existing shots and create an animatic. Attach a timeline screenshot and adjacent-shot comparisons; record narrative clarity, material to replace, and one priority for the next test. This is a plan, not a fabricated completed production entry."}}}</script>
<script>
const {sections,ui}=JSON.parse(document.getElementById('project-data').textContent);let lang='zh',focus=false,current=0;const t=v=>v[lang],I=(n,alt,cls='')=>`<figure class="image-frame ${cls}"><img src="assets/${n}.jpg" alt="${alt}" loading="lazy"><figcaption class="caption">${lang==='zh'?'项目 AI 参考图 · 现有素材':'Project AI reference image · Existing material'}</figcaption></figure>`;const tx=(a,b)=>lang==='zh'?a:b;
function extra(s){switch(s.id){case'idea':return `<div class="timeline">${[[27,'繁荣 · 人工创造的乐园','Prosperity · An engineered paradise','温暖、秩序与日常生活','Warmth, order, and everyday life'],[47,'崩溃 · 技术失去控制','Collapse · Technology out of control','历史成为废墟，知识成为残片','History becomes ruins; knowledge becomes fragments'],[0,'重建 · 地下重新生活','Rebuilding · Life underground','资源有限，但探索重新开始','Resources are limited; exploration begins again']].map(x=>`<figure><img src="assets/${x[0]}.jpg" alt="${tx(x[1],x[2])}" loading="lazy"><h4>${tx(x[1],x[2])}</h4><p>${tx(x[3],x[4])}</p></figure>`).join('')}</div>`;
case'motivation':return `<div class="motivation-path">${[['观看动画','Watching the anime'],['构想游戏','Imagining a game'],['写下背景','Writing its history'],['制作影像','Making the film']].map((x,i)=>`<div><small>0${i+1}</small>${tx(...x)}</div>`).join('')}</div>`;
case'references':return `<div class="reference-band">${I(27,tx('繁荣时期的灰蓝与奶油黄','Blue-grey and cream in prosperity'))}${I(0,tx('地下城市的黑暗与炉火','Darkness and furnace light underground'))}</div><div class="reference-links">${tx('后续 Visual Journey 研究入口：','Further Visual Journey research:')} <a href="https://titanbooks.com/creators/john-harris/" target="_blank" rel="noreferrer">John Harris</a> · <a href="https://chrisfossart.com/portfolio/" target="_blank" rel="noreferrer">Chris Foss</a></div>`;
case'plan':return `<div class="steps">${[['01','梳理范围','Define scope','保留因果链，确定一期边界。','Preserve the causal chain and define the first-stage boundary.'],['02','制作 animatic','Create an animatic','静帧、现有片段与临时旁白先进入时间线。','Put stills, existing clips, and temporary narration on a timeline.'],['03','迭代关键镜头','Refine key shots','先完成故事转折，再补连接镜头。','Complete turning points before connecting shots.'],['04','整合与观看测试','Integrate and review','剪辑、声音、调色，检查陌生观众能否理解。','Edit, add sound and colour, and test understanding with a new viewer.']].map(x=>`<div class="step"><b>${x[0]}</b><span><strong>${tx(x[1],x[2])}</strong>${tx(x[3],x[4])}</span></div>`).join('')}</div>`;
case'workflow':return `<div class="arrowline">${[['故事 / 分镜','Story / storyboard'],['参考约束','Reference constraints'],['AI 视频测试','AI video tests'],['版本选择','Selection'],['剪辑 / 声音','Editing / sound']].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span>${tx(...x)}</span>`).join('')}</div><table class="role-table"><thead><tr><th>${tx('制作环节','Stage')}</th><th>${tx('我的判断与工作','My decisions and work')}</th><th>${tx('AI 的具体作用','Specific AI role')}</th></tr></thead><tbody>${[['叙事 / 分镜','Story / shots','写背景、选择范围、安排事件与情绪。','Write the background, select scope, arrange events and emotion.','为描述和视觉测试提供辅助，方向由我确定。','Assist descriptions and visual tests; I set the direction.'],['画面 / 运动','Visuals / motion','固定参考、定义动作、检查一致性。','Fix references, define actions, check continuity.','生成图像与运动的候选版本。','Generate candidate images and motion versions.'],['最终整合','Final integration','取舍素材，控制剪辑、声音和色彩。','Select material and control editing, sound, and colour.','提供候选素材；成片结构由我组织。','Provide candidate material; I organise the film.']].map(x=>`<tr><td>${tx(x[0],x[1])}</td><td>${tx(x[2],x[3])}</td><td>${tx(x[4],x[5])}</td></tr>`).join('')}</tbody></table><div class="test-media"><div><video controls preload="metadata" poster="assets/31.jpg"><source src="assets/test-clip.mp4" type="video/mp4"></video><p class="caption">${t(ui.sample)}</p></div><div><h3>${tx('测试的目的，<br>是验证一个镜头。','The test checks<br>one shot.')}</h3><p>${tx('当前片段来自已有第一章视频素材。后续检查画面是否保持二维绘画感、主体是否稳定、运动是否符合分镜；不能只凭单帧好看就判断镜头完成。','This clip comes from existing Chapter One video material. Further review should check the painted 2D appearance, subject stability, and whether motion matches the storyboard. An attractive frame alone does not make a completed shot.')}</p><p class="caption">${t(ui.assets)}</p></div></div>`;
case'questions':return `<div class="questions-list">${[['哪些信息现在讲，哪些留给游戏？','What should the film explain, and what should the game reveal?'],['一期先完成前三章，是否更可行？','Is completing the first three chapters a more feasible first step?'],['什么证据能展示我的创作控制？','What evidence best demonstrates my creative control?']].map((x,i)=>`<p><b>0${i+1}</b>${tx(...x)}</p>`).join('')}</div>`;}}
const hero=()=>`<section class="hero" id="top"><div><div class="eyebrow">FINAL PROJECT / IDEA PRESENTATION</div><h1>${t(ui.heroTitle)}</h1><p class="subtitle">${t(ui.heroSub)}</p><p class="lead">${t(ui.heroLead)}</p><a href="#idea" class="entry"><span>${t(ui.begin)}</span><span>↗</span></a></div><div class="hero-visual"><svg class="orbit" viewBox="0 0 600 720" aria-hidden="true"><g fill="none" stroke="#a08149" stroke-width=".8"><ellipse cx="300" cy="360" rx="270" ry="300" transform="rotate(-23 300 360)"/><ellipse cx="300" cy="360" rx="235" ry="330" transform="rotate(20 300 360)"/><path d="M20 360h60m440 0h60M300 0v45m0 630v45"/><circle cx="117" cy="130" r="6"/><circle cx="494" cy="570" r="5"/></g></svg><div class="arch"><img src="assets/27.jpg" alt="${tx('架空海王星文明的云端城市','A cloud city in the fictional Neptunian civilization')}" fetchpriority="high"></div><div class="visual-label">${tx('失落的光，<br>仍在等待被发现。','A lost light,<br>waiting to be found.')}</div></div><div class="hero-caption"><span>PATHWAY II · ANIMATION / 3D / VIDEO ART</span><span>${tx('暂定片名 · 现有项目 AI 参考图','Working title · Existing project AI reference image')}</span></div></section>`;
function render(){const old=window.scrollY;document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.body.classList.toggle('en',lang==='en');document.querySelectorAll('[data-ui]').forEach(x=>x.textContent=t(ui[x.dataset.ui]));document.getElementById('language').textContent=lang==='zh'?'EN':'中文';document.getElementById('mode').textContent=t(focus?ui.read:ui.mode);document.querySelector('.top-nav').innerHTML=sections.map(s=>`<a href="#${s.id}">${tx(s.label.zh.split('与')[0],s.num+' '+s.label.en.split(' &')[0])}</a>`).join('');document.querySelector('.side-index').innerHTML=sections.map(s=>`<a href="#${s.id}" title="${t(s.label)}" aria-label="${t(s.label)}"></a>`).join('');
document.getElementById('page').innerHTML=hero()+`<section class="overview"><div class="eyebrow">THE PROPOSAL / SIX PARTS</div><h2>${t(ui.intro)}</h2><div class="toc">${sections.map(s=>`<a href="#${s.id}"><span class="num">${s.num}</span>${t(s.label)}<small>${s.time}</small></a>`).join('')}</div><p class="caption">${t(ui.timing)}</p></section>`+sections.map(s=>`<section class="chapter ${s.id==='idea'||s.id==='questions'?'dark':''}" id="${s.id}"><div class="chapter-top"><span class="chapter-number">${s.num}</span><span class="chapter-label">${t(s.label)}</span><span class="chapter-time">${s.time}</span></div><div class="intro-grid"><div><h2>${t(s.title)}</h2><p class="lead">${t(s.lead)}</p>${s.question?`<div class="quote">${t(s.question)}</div>`:''}${s.id==='plan'||s.id==='questions'?extra(s):''}<button class="note-button" data-notes="${s.num}">${t(ui.notes)} <span>↗</span></button></div>${I(({idea:41,motivation:28,references:21,plan:1,workflow:32,questions:25})[s.id],t(s.label),s.id==='references'||s.id==='questions'?'arch-small':'')}</div>${s.id==='idea'||s.id==='references'||s.id==='motivation'||s.id==='workflow'?extra(s):''}<div class="details-grid">${s.details.map(d=>`<div>${t(d)}</div>`).join('')}</div></section>`).join('')+`<section class="bridge" id="website"><div class="eyebrow">LIVING STUDIO / CONNECTED ARCHIVES</div><h2>${t(ui.bridge)}</h2><p class="lead">${t(ui.bridgeSub)}</p><div class="bridge-grid">${[['项目提案','Project proposal','今天的六部分、分镜与现有测试。说明方向和预期体验。','The six parts, storyboards, and tests. Explain the direction and intended experience.'],['Visual Journey','Visual Journey','记录外部作品、具体观察与参考如何影响镜头。','Record external work, observations, and how references shape shots.'],['Working Log','Working Log','记录实际测试、证据、取舍、问题和下一步。','Record actual tests, evidence, decisions, problems, and next actions.']].map(x=>`<article><h3>${tx(x[0],x[1])}</h3><p>${tx(x[2],x[3])}</p></article>`).join('')}</div><div class="log"><h3>${t(ui.working)}</h3><p>${t(ui.workingText)}</p></div></section><footer><span>FOLD WORLD / FROM THE ABYSS</span><span>${tx('初期提案 · 2026.10','Initial proposal · 2026.10')}</span><button id="print">${t(ui.print)}</button><a href="../index.html" id="back-world">${t(ui.back)} ↗</a></footer>`;
document.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>openNotes(Number(b.dataset.notes)-1));document.getElementById('print').onclick=()=>window.print();document.getElementById('back-world').href='../index.html';observe();window.scrollTo(0,old)}
let observer;function observe(){observer?.disconnect();observer=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){current=sections.findIndex(s=>s.id===e.target.id);document.querySelectorAll('.side-index a,.top-nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));}},{rootMargin:'-20% 0px -55% 0px'});document.querySelectorAll('.chapter').forEach(s=>observer.observe(s))}
let opener;function openNotes(index){opener=document.activeElement;const all=index===-1;const set=all?sections:[sections[index]];document.getElementById('notes-body').innerHTML=`<div class="eyebrow">SPEAKER NOTES</div><h2>${t(ui.notes)}</h2><small>${t(ui.timing)}</small>${set.map(s=>`<h3>${s.num} · ${t(s.label)}</h3><small>${s.time}</small><p>${t(s.speech)}</p>`).join('')}${all?'':`<div class="note-nav"><button id="prev-note">← ${tx('上一段','Previous')}</button><button id="next-note">${tx('下一段','Next')} →</button></div>`}`;document.querySelector('.notes-panel').classList.add('open');document.querySelector('.notes-panel').inert=false;document.querySelector('.scrim').classList.add('open');document.body.style.overflow='hidden';document.querySelector('.notes-panel').scrollTop=0;document.querySelector('.notes-panel .close').focus();if(!all){document.getElementById('prev-note').onclick=()=>openNotes((index+5)%6);document.getElementById('next-note').onclick=()=>openNotes((index+1)%6)}}
function closeNotes(){document.querySelector('.notes-panel').classList.remove('open');document.querySelector('.notes-panel').inert=true;document.querySelector('.scrim').classList.remove('open');document.body.style.overflow='';opener?.focus()}
document.querySelector('.close').onclick=closeNotes;document.querySelector('.scrim').onclick=closeNotes;document.getElementById('all-notes').onclick=()=>openNotes(-1);document.getElementById('language').onclick=()=>{const active=sections[current]?.id;lang=lang==='zh'?'en':'zh';closeNotes();render();if(window.scrollY>900&&active)document.getElementById(active).scrollIntoView()};document.getElementById('mode').onclick=()=>{focus=!focus;document.body.classList.toggle('focus',focus);document.getElementById('mode').setAttribute('aria-pressed',focus);document.getElementById('mode').textContent=t(focus?ui.read:ui.mode)};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeNotes();if(document.querySelector('.notes-panel').classList.contains('open')){if(e.key==='Tab'){const a=[...document.querySelector('.notes-panel').querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}return}if(e.target.tagName==='VIDEO')return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();current=Math.max(0,Math.min(5,current+(e.key==='ArrowRight'?1:-1)));document.getElementById(sections[current].id).scrollIntoView()}});window.addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;document.querySelector('.progress').style.width=(max?scrollY/max*100:0)+'%'},{passive:true});render();
</script></body></html>
