;meta charset=&quot;utf-8&quot;&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;style&gt;body{padding:25px;color:#354039;background:#fffdf6}pre{font:16px/2 Microsoft YaHei,Arial,sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:100%;height:auto}figure{margin:25px 0}h2{font:22px Arial}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;pre&gt;全部镜头共用要求
复古科幻史诗动画，概括性油画厚涂风格，宽平笔刷与块面塑形，低饱和灰蓝、石板蓝为主，奶油白、暗金与浅赭用于光源和灾变。物体具有稳定体积，转动时要展示侧面、背面及遮挡变化，不能只是静态图片分层移动。
**参考图用于确定造型、配色和氛围，不锁定首帧、构图与物体位置。**可以为了动作合理性重新组织场景、补充空间。
**运动主要来自画面内容：**人物有完整行动，机械有启动与传动过程，舰船有转向与队形变化，建筑有受力与坍塌过程，云、水、烟尘随事件产生连续变化。背景运动服从事件和环境，不让所有物体无意义地同时晃动。
摄影机以适度推拉、升降、弧线移动和跟拍为主，关键动作允许固定机位。每个镜头集中表现一件主要事件，通常使用一个主机位，必要时切换一至两次。只在撞击、断裂、擦身而过等节点短暂加速，不连续冲刺，不频繁甩镜，不用无来源震屏代替动作。
节奏遵循“动作酝酿—变化发生—结果显露”，快慢交替；切镜保持方向、尺度和空间关系。

第一段｜气候成为武器
镜头01｜调节气候的塔，开始转向
12秒
**0—4秒：**城市上空中远景，摄影机缓慢向气候塔靠近并略微升高。塔顶第一层环架开始转动，周围维护平台收拢，少量积尘沿支架落下。
**4—9秒：**切塔顶斜侧面，摄影机做小幅弧线移动。不同轴线上的巨大环架依次转动，互相遮挡、错开，逐渐从日常运行姿态调整为同一方向。环架先加速，再沉重减速。
**9—12秒：**环架锁定。切城市广角，远方几座气候塔先后完成转向，天空恒光带逐段亮起。云层被照出清晰明暗变化，城市中的交通仍在运行，形成日常秩序与异常动作的对照。
镜头02｜恒光被抽向一个地方
14秒
**0—5秒：**恒光带侧面广角，摄影机匀速横移。不同纵深的弧形模块逐段降低亮度，目标方向的模块持续增亮，能源转移通过明确的先后顺序表现。
**5—10秒：**切目标城区屋顶，保持稳定机位。建筑上的阴影逐渐改变，立面反光增强，屋顶薄雾蒸散，轻薄遮阳结构受热变形。上空云层开始翻滚并向高处抬升。
**10—14秒：**摄影机缓慢升高，揭示整片城区都处于异常亮区之中。中心云团翻腾扩大，外围城区依旧昏暗。运动来自不断发展的热作用，不出现实体激光柱。
镜头03｜热力学清洗
12秒
**0—4秒：**街道中景，摄影机沿街缓慢后退。强光越来越白，玻璃接连开裂，金属顶棚翘曲，蒸汽从路面和建筑缝隙升起；远处楼体在热浪中失去清晰轮廓。
**4—8秒：**切城区外山脊远景。镜头基本固定，中心区域迅速增亮，建筑轮廓从中心向外被翻涌的炽亮气团吞没。低云向上鼓起，外围云墙被推开。
**8—12秒：**摄影机缓慢拉远。高亮逐渐退去，原先的密集天际线不再显露，地面覆盖暗红余光与滚动热雾。保留外围山体作为参照，让毁灭过程和范围清楚可见。
镜头04｜重力锚点逆转
16秒
**0—6秒：**城市底部开放检修区，摄影机沿中央锚定器做适度弧线移动。制动夹具打开，多层机械环先减速、短暂停顿，再反向启动；悬挂检修平台随结构震动摆动，接缝光线依次改变。
**6—11秒：**切上层广场。一阵沉重震动传来，人群停步、失衡，扶住栏杆；松动物件短暂离地后落回地面。摄影机跟随一名行人转向城市外缘，远处云层正相对护墙向上移动。
**11—16秒：**切外部全景，摄影机轻微下降跟随。整座城市开始下沉，基座逐渐压入云层，云雾沿外壁向上翻卷。下沉由缓到快，但城市整体仍保持完整。
镜头05｜整座城市成为攻城锤
12秒
**0—4秒：**云层下方侧面大全景，摄影机稳定观察。城市庞大的基座先穿出云底，随后整片建筑群显露，周围拖带的云雾沿外壁散开，下方海面出现不断扩大的阴影。
**4—8秒：**切远处海岸机位，镜头略微上仰容纳城市。基座撞入海面，接触区域下陷，海水沿城市周边抬起形成水墙；较低建筑开始被涌入的水流吞没。
**8—12秒：**切高空斜俯视，缓慢拉远。水墙向四周扩展，城市继续下沉，部分塔楼在结构失稳后倾倒。远处海岸与港口保留在画面中，交代冲击规模，不以持续震屏表现重量。
镜头06｜深海中的回应
14秒
**0—4秒：**意识存储大厅内，摄影机缓慢推进。震动沿地板传来，柜体在固定架内晃动，承压门开始变形，接缝喷出几股细水流。
**4—9秒：**切舱门侧面的中广角。固定件依次断裂，门板向内倾倒，洪水撞入大厅，先冲散轻小物件，再撞击第一排存储柜。柜体受力倾斜，连接线被拉紧、扯断。
**9—14秒：**切高处维修平台俯拍，摄影机适度横移。水流绕过柜列、碰撞回旋，局部柜体连续倒下，灯光随浸水逐区熄灭。最后一个仍亮着的核心被上升水面覆盖，亮光在浑水中消失。

第二段｜缓慢的凋零
镜头07｜数百年以后
12秒
**0—5秒：**废弃城市街区，摄影机以步行般的速度向前移动。破损金属板在风中翻动，扬尘穿过空窗，一扇失去固定的门反复碰撞门框。远处气候塔从建筑间逐渐显露。
**5—9秒：**切塔身中远景，镜头缓慢抬升。悬挂的断裂环架在风中摇动，连接点落下碎屑，最终一段外侧构件脱落，撞上下一层平台后折断坠下。
**9—12秒：**切城市广角，坍塌扬起的尘雾在废墟间扩散。天空残存光带闪亮一次又暗下去，摄影机停住，让风与尘雾继续运动，突出漫长衰败，而非连续灾难奇观。
镜头08｜海洋变黑
14秒
**0—5秒：**贴近海岸的低机位，摄影机沿岸缓慢移动。黏重黑浪一层层推进，撞上已经矿化的护岸，水流漫过边缘，再从晶簇缝隙间退回。
**5—10秒：**切晶簇之间的中景。回流带走支撑物，一根被掏空底部的矿化立柱缓缓倾斜，随后折断，砸碎相邻结构，黑水与碎晶向周围溅开。摄影机只做小幅跟随。
**10—14秒：**摄影机逐渐升高，显露被晶体覆盖的道路、车辆与港口。新一轮黑浪从背景涌来，沿整条海岸接连撞开。晶体保持固态，侵蚀规模通过环境揭示，不依靠现场飞速生长。
镜头09｜又一座城市消失
12秒
**0—4秒：**废弃交通大厅内，机位稳定。地板轻微倾斜，一只金属箱开始滑动，撞上长椅后改变方向；吊灯缓慢摆动，窗外云层不断升高。
**4—9秒：**切城市外部中远景，摄影机适度下降跟随。城市持续沉入云海，云雾先吞没下层街区，再漫过高处平台。一段外缘结构断裂落下，片刻后消失在云中。
**9—12秒：**切更远的固定全景，最后一座塔尖缓缓没入云层，云面留下的扰动逐渐合拢。最后两秒保留空旷天空，不再追加新的大动作。
镜头10｜永生停止运转
12秒
**0—4秒：**意识存储大厅中景，摄影机缓慢经过几排核心。冷却装置仍在运转，核心各自闪动；中央供能结构突然出现间歇停顿，一处管接头泄出白雾。
**4—8秒：**切纵深广角，摄影机基本固定。灯光从远端开始逐区熄灭，机械托架先后减速，停在不同位置。备用供能装置尝试启动，使近处一排核心短暂恢复亮度，随即再次暗下。
**8—12秒：**切最后一枚核心，轻轻推近。内部微光不规则跳动，渐渐变弱，最终完全消失。背后的冷却叶轮依靠惯性转过最后半圈停住，核心完整地留在承座上。
镜头11｜保住肉体的人
14秒
**0—5秒：**诊疗舱侧面中景，摄影机随人物小幅移动。幸存者撑着床沿坐起，停顿喘息，再尝试站立。他膝盖发软，及时抓住旁边吊架，吊架被拉得轻轻晃动。
**5—10秒：**人物扶着设备走近控制台，按下开关，设备亮起片刻便熄灭。他再次按压，却被咳嗽打断，手臂碰落金属杯。摄影机稍微下俯，杯子在地面滚动，人物扶着台面缓缓跪下。
**10—14秒：**切半身近景。他看向颤抖的手，再慢慢靠墙坐下。摄影机轻微后拉，将空床与停摆设备带入画面。人物仍在呼吸、尝试调整姿势，不突然静止成参考图。

第三段｜最后的赌注
镜头12｜轨道之外，最后集结
14秒
**0—5秒：**舰队外围中广角，摄影机与一艘护航舰并行。护航舰缓慢改变航向，姿态喷口短促点亮，驶向大型旗舰侧后方；背景中其他舰船以不同速度进入队列。
**5—10秒：**摄影机逐渐升高，越过旗舰上缘，对面的另一支舰队从遮挡后显露。近处舰船开始制动、调整间距，远处舰艇仍在汇入，整个画面具有多层次运动。
**10—14秒：**切轨道大全景，镜头缓慢拉远。两支舰队分别占据左右空域，海王星与残破防线位于下方。最后几艘舰船完成转向，阵形逐渐稳定，而不是所有舰船静止排列。
镜头13｜思维格式化
14秒
**0—5秒：**核心大厅中广角，摄影机缓慢后移。十二组核心承座沿环形轨道移动，在不同位置相继停下；连接臂展开、下降，与承座逐一锁合。
**5—10秒：**切斜侧面，摄影机绕阵列移动一小段。核心原本各自闪动的光逐渐同步，中央多层环架依次旋转，顶部防护板向两侧展开。前景连接臂与后方环架形成持续遮挡变化。
**10—14秒：**切中央装置的低角度广景。机械环逐层对轴、减速、锁定，连接线路由外向内亮起。最后一层环架完成校准后，整组核心保持稳定发光，只有辅助结构继续低速运转，武器尚未释放。
镜头14｜足以引爆地核的武器
16秒
**0—5秒：**旗舰腹部侧面全景，摄影机轻微向后移动。舱门上的锁扣按顺序打开，两扇厚重装甲向外展开，内部照明逐排亮起，显露武器和承载轨道。
**5—11秒：**切舱内侧面机位。重型托架缓慢推进，多面体武器从深处移向舱外；供能管线依次脱开并收回，侧向限位装置展开，主托架始终稳定承托武器。
**11—16秒：**切舱外斜前方，摄影机做适度弧线移动。武器完全伸出后，安装架调整俯角，对准下方行星。最后一组锁定件扣合，主体停止移动，表面接缝逐渐亮起。用机械步骤和尺度表现威胁，不用突然冲向武器的镜头。
镜头15｜毫秒之前的寂静
12秒
**0—4秒：**两军之间的广角，摄影机缓慢侧移。最后几艘护航舰退出中央射界，双方旗舰上的武器结构完成细微调整，中央空域逐渐清空。
**4—8秒：**两次简洁切镜：左侧广播环架的校准机构停止转动；右侧指挥舱内，一名指挥者抬手准备启动，却停在控制面板上方。人物目光由面板转向舷窗。
**8—12秒：**回到两军对峙大全景，摄影机逐渐停稳。双方装置保持待发亮度，下方行星最后几处微光熄灭。只保留微小舰体漂移，最后两秒刻意安静，为下一镜的异常形成反差。

第四段｜审判之星
镜头16｜预警迟到了
12秒
**0—4秒：**指挥舱中景，摄影机轻微推进。值守人员发现异常，身体前倾确认，随即推开座椅站起、指向舷窗，周围人员接连转头。窗外光线开始被遮蔽。
**4—8秒：**切舰桥外部，摄影机基本稳定。庞大炭黑岩体从上方经过，粗糙表面持续掠过，先遮住星空，再遮住行星亮边；下方舰船开始侧倾避让，天线和舰桥提供体量参照。
**8—12秒：**切战场广角，镜头缓慢转向跟随岩体。它进入两支舰队之间，附近舰船向两侧分散，原本整齐的队形被迫打开缺口。海王星始终位于岩体前进方向。
镜头17｜两支舰队，同一个目标
16秒
**0—5秒：**舰队侧面广角，摄影机适度横移。两侧舰船先后转向陨石，炮塔跟随目标调整角度，几组拦截舰离开阵列，沿不同高度接近。
**5—10秒：**切陨石侧面跟拍，摄影机保持相对平稳。拦截火力接连撞击岩面，产生局部亮斑和剥落碎块；一艘拦截舰完成射击后转弯脱离，另一艘从更高处接替。陨石主体航向不变。
**10—16秒：**切战场远景。陨石穿过阵线，前方舰船陆续避让，少数舰艇仍在转向追击。摄影机缓慢下俯，将越来越近的行星带入画面。运动重点是交错飞行、火力与规避关系，而非摄影机追着目标狂奔。
镜头18｜惨白的尾焰
14秒
**0—5秒：**大气层外侧中远景，摄影机以平稳速度跟随。陨石逐渐进入浓厚大气，前缘从暗色变为苍白，碎片从表层剥落，尾焰在后方不断拉长。
**5—9秒：**切云层下方固定仰拍。云顶先被照亮，随后岩体穿破云层进入视野，周围云团被挤开，尾迹拖拽出翻卷的云带。摄影机适度上仰跟随，不做突然甩动。
**9—14秒：**切地表山脊大全景。陨石斜贯天空，苍白尾焰照亮前景岩峰，投影随其经过移动。镜头缓慢转向落点，保留地形与轨迹的关系，最后让陨石进入远方撞击区。

第五段｜深渊诞生
镜头19｜撞击
12秒
**0—3秒：**撞击区远侧广角，摄影机稳定观察陨石完成最后下降。岩体接触地表后继续向深处贯入，接触区迅速增亮，周边地面开始隆起。
**3—8秒：**保持这一机位或切稍远全景。大量岩土被向外掀起，中心喷出高耸物质柱，尘墙沿地表向四周扩散。摄影机只做适度拉远，将不断扩大的灾变容纳进画面。
**8—12秒：**切远处废弃设施，镜头固定在厚墙侧后方。远方尘墙逼近，建筑由远及近被吞没；冲击到达后，窗面碎裂，松动立柱倾倒，碎屑与尘浪扫过墙角。震动仅在冲击抵达时短暂出现。
镜头20｜天空失去支撑
14秒
**0—5秒：**高空城市群大全景，摄影机缓慢横移。不同城市底部的暗金光先后熄灭，最近城市开始下降，相邻城市稍后才发生变化。连接桥梁被逐渐拉斜，接头开裂。
**5—10秒：**切近处城市外缘。桥梁在两端高度差拉扯下断开，悬挂运输舱随断桥下坠；城市轻微倾斜，外侧平台上的松散物件滑向边缘。摄影机适度下降跟随，云层不断向建筑上部漫过。
**10—14秒：**切云海上方全景，缓慢拉远。多座城市以不同姿态沉入云中，巨大的云团沿基座两侧翻起。最后几座塔尖先后消失，天空逐渐空下来，而不是整张城市图一起下移。
镜头21｜轨道防线解体
16秒
**0—5秒：**轨道防线侧面中广角，摄影机缓慢沿结构移动。姿态喷口异常工作后熄灭，相邻模块开始向不同方向偏转，连接梁受拉弯曲，最终断裂；断开的模块带着原有动量缓慢翻转。
**5—10秒：**切防线与舰队交界处。大块残骸进入航道，一艘舰船提前转向避开，另一艘来不及完全调整，侧翼被擦中，装甲碎片飞散，舰体出现失控旋转。镜头保持稳定，清楚展示碰撞前后关系。
**10—16秒：**切更宽阔的轨道全景，摄影机缓慢下俯。高处防线持续分离，中层舰船各自规避，下方早已失去高度的舰艇开始进入大气，出现苍白尾迹。三个空间层次同时发展，但不把所有物体做成同方向坠落。
镜头22｜不是陨石坑
12秒
**0—4秒：**破碎地表的中低机位，摄影机适度前移。风推动尘雾横穿道路，遮挡逐渐散开，前方道路突然终止，巨大裂隙从烟尘后显露。镜头在边缘前减速。
**4—8秒：**摄影机平缓升高并向侧面移动，展示被截断的地层、道路和构筑物。裂口不断向远处延伸，两侧陡壁从遮挡中展开，明确揭示它不是圆形陨石坑。
**8—12秒：**切裂口边缘向下俯拍，摄影机保持稳定。一大片松动岩层先开裂、倾斜，再整体脱落，碰撞崖壁后分裂成数块，继续坠向黑暗。巨岩逐渐缩小，最终消失；尘土仍沿崖壁缓缓滑落，看不到底，也不出现落底闪光。



01 | The Towers Turn | 12s
Once, these towers governed the weather and gave the cities their seasons.
Then their masters turned them toward a different purpose.
Climate became a weapon.
02 | The Light Converges | 14s
They dimmed the light elsewhere, concentrating its heat above a single city.
The people below looked up…
and saw the brightest sky of their lives.
03 | Thermal Cleansing | 12s
No shells fell.
The temperature simply kept rising.
Streets, towers, and those who could not escape…
all began to lose their shape.
04 | The Gravity Anchors Reverse | 16s
The gravity anchors holding the city aloft received a new command.
People gripped the railings, expecting the tremor to pass.
Then the clouds outside their windows began to rise.
05 | A City Becomes a Battering Ram | 12s
The weight of an entire city came crashing down upon another home.
As the sea rose, those aboard and those ashore heard the same thunder.
06 | The Deep Gives Way | 14s
They had stored their minds beneath the ocean, believing the depths were quiet. Safe.
Then war tore open the doors.
Water rushed in.
Row by row, the cores went dark.

Part II — The Long Decline
07 | Centuries Later | 12s
Centuries passed. The machines left by the war kept running.
But fewer people remembered how to repair them.
While they waited, the cities slowly fell apart.
08 | The Ocean Turns Black | 14s
The ocean darkened. Strange crystals spread across the harbors and shores.
People retreated inland, again and again.
The places marked as home on their old maps were now beyond reach.
09 | Another City Vanishes | 12s
The last evacuation ship had departed long ago.
Now, the systems keeping the city aloft finally failed.
Another skyline sank into the clouds, with no one left to watch.
10 | Immortality Goes Dark | 12s
A mind could be preserved.
The machine preserving it could still decay.
When the final reserve of power ran dry,
immortality came to an end.
11 | Those Who Kept Their Bodies | 14s
Those who kept their bodies fared little better.
They waited for medicine. For parts to repair the machines.
Eventually, all they could do was hope their bodies would heal.

Part III — The Final Gamble
12 | The Last Assembly | 14s
Beyond Neptune, the Ascensionists and the Preservationists gathered their remaining fleets.
Neither side could afford another war.
Neither would be the first to withdraw.
13 | Reformatting the Mind | 14s
The Ascensionists activated their mind-reformatting array.
They believed war would end once every mind was made to agree.
Whether those minds consented…
was no longer part of the calculation.
14 | The Corebreaker | 16s
The Preservationist flagship opened its weapons bay.
Inside lay a device powerful enough to detonate the planetary core.
They would rather destroy humanity’s last home than let their enemies decide its future.
15 | The Silence Before | 12s
The firing lanes were clear.
The weapons were locked.
Both sides waited for the final command.
For a few more seconds, they could still choose to stop.

Part IV — The Judgment Star
16 | The Warning Comes Too Late | 12s
By the time the alarms sounded, the object had crossed the outer defenses.
It eclipsed the light beyond the bridge and headed straight for Neptune.
No answer came.
17 | One Target | 16s
Both fleets turned their guns almost at once.
Ships that had been aiming at one another now fired on a common target.
Their volleys battered its surface.
Nothing changed its course.
18 | The Pale Trail | 14s
It entered the atmosphere, trailing a pale white blaze.
Clouds tore apart. The ground lit up beneath it.
The fleets’ final volleys vanished into the sky behind.

Part V — The Abyss Opens
19 | Impact | 12s
The impact came far away.
First, the horizon lit up. Then the ground began to shake.
By the time the sound arrived, dust had swallowed the sky.
20 | The Sky Gives Way | 14s
In the aftermath, the levitation systems failed one after another.
Bridges snapped. Cities tilted.
The lights that had hung overhead for centuries sank beneath the clouds.
21 | The Orbital Defenses Break Apart | 16s
In orbit, the defenses were breaking apart.
Ships swerved around wreckage as shattered structures drifted across their paths.
The fleets that had prepared to decide humanity’s future were now struggling simply to escape.
22 | Not a Crater | 12s
When the dust cleared, there was no crater.
A vast fissure stretched into the distance.
Rocks were still falling.
No one could see the bottom.
